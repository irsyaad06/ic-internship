<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - iCraftDS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .coming-soon-wrapper {
            min-height: calc(100vh - 80px); /* Adjust based on navbar height */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: transparent;
        }

        .coming-soon-card {
            max-width: 600px;
            padding: 4rem 3rem;
            border-radius: 24px;
        }

        .cs-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .cs-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary-start), var(--primary-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cs-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    
    <!-- Abstract Background -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Navbar -->
    <header class="site-header">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <img src="icLogo.png" alt="iCraftDS Logo" style="height: 26px; width: auto; display: block;">
            </a>
            
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="ketentuan.html">Ketentuan</a></li>
                <li><a href="comingsoon.html?page=Dokumentasi">Dokumentasi</a></li>
                <li><a href="timeline.html">Timeline</a></li>
                <li><a href="daftar.html" class="btn-primary">Daftar</a></li>
            </ul>
        </div>
    </header>

    <div class="coming-soon-wrapper">
        <div class="coming-soon-card glass-card fade-in-up">
            <div class="cs-icon">🚀</div>
            <h1 class="cs-title">Segera Hadir</h1>
            <p class="cs-subtitle">Halaman <strong id="page-name" style="color: var(--text-primary);"></strong> sedang dalam tahap pengembangan. Kami sedang menyiapkan sesuatu yang luar biasa untuk Anda.</p>
            <a href="index.html" class="btn-primary" style="display: inline-block;">Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        
        const pageNameEl = document.getElementById('page-name');
        if (page) {
            pageNameEl.textContent = page;
        } else {
            pageNameEl.textContent = "ini";
        }
    </script>
    <!-- JS Logic -->
    <script src="main.js"></script>
</body>
</html>
